name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Only pull standard profile data
          base: header, community, repositories, metadata

          # Include languages but disable activity plugins
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Safety overrides
          config_timezone: UTC