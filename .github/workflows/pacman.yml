name: generate arcade contribution graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate pacman game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          # Blue & Black Theme Customization
          color_background: '#0d1117' # Deep black-blue background
          color_empty: '#161b22'      # Dark tile for zero contributions
          color_dots: '#1f6feb'       # Blue dots/food
          color_ghost_1: '#58a6ff'    # Light blue ghost
          color_ghost_2: '#388bfd'    # Mid-blue ghost
          color_ghost_3: '#1f6feb'    # Cobalt blue ghost
          color_ghost_4: '#0d419d'    # Deep blue ghost

      - name: push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}